<!DOCTYPE html>
<html lang="pl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Panel Admina</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <header>
    <h1>Panel Administracyjny</h1>
    <nav>
      <a href="index.html">Strona główna</a>
    </nav>
  </header>

  <main>
    <!-- Sekcja logowania -->
    <section id="login-section">
      <h2>Zaloguj się</h2>
      <form id="login-form">
        <label for="password">Hasło:</label>
        <input type="password" id="password" required>
        <button type="submit">Zaloguj się</button>
      </form>
    </section>

    <!-- Sekcja admina (formulary do wpisywania postów) -->
    <section id="admin-section" style="display: none;">
      <h2>Dodaj nowy post</h2>
      <form id="post-form">
        <label for="title">Tytuł:</label>
        <input type="text" id="title" required>

        <label for="content">Treść:</label>
        <textarea id="content" required></textarea>

        <label for="image">Link do obrazka:</label>
        <input type="url" id="image" placeholder="https://example.com/obrazek.jpg" required>

        <button type="submit">Dodaj wpis</button>
      </form>
      <div id="post-list"></div>
    </section>
  </main>

  <footer>
    <p>&copy; 2025 Blog. Wszystkie prawa zastrzeżone.</p>
  </footer>

  <script src="admin.js"></script>
</body>
</html>
